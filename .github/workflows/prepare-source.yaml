name: Prepare Quilling Lines source migration
on:
  push:
    branches: [prepare/quilling-lines-source031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve and preserve original formal gates
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
          mkdir -p acceptance
          calcit --check-only --all-defs --format json > acceptance/all-before.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests-before.json
          yarn build
      - name: Official guarded source migration
        run: node apply-reviewed.mjs
      - name: Resolve target published graph
        run: |
          set -euo pipefail
          cp target-deps.cirru deps.cirru
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          cmp deps.cirru target-deps.cirru
          git diff --quiet -- package.json yarn.lock .yarnrc.yml
      - name: Full acceptance against migrated source and published graph
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs --format json > acceptance/all.json
          calcit --check-only --ns 'app.$meta' --ns app.config --ns app.container --ns app.main --ns app.schema --ns app.updater --format json > acceptance/public.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests.json
          calcit analyze weak-types --only deprecated-call --format json > acceptance/deprecated.json
          cat acceptance/deprecated.json
          jq -e '.data.summary.calls == 0' acceptance/deprecated.json
          calcit analyze weak-types --only dynamic-method --summary-only --format json | tee acceptance/dynamic-method.json | jq -e '.data.summary.findings == 0'
          yarn build
          yarn vite build --base=./
          git diff --quiet -- assets main.mjs package.json yarn.lock .yarnrc.yml
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist js-out acceptance/
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: quilling-lines-source-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
