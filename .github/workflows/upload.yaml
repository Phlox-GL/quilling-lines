name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: add cr
      run: |
        mkdir -p $GITHUB_WORKSPACE/bin
        wget -O $GITHUB_WORKSPACE/bin/cr https://github.com/calcit-lang/calcit/releases/download/0.6.1/cr
        chmod +x $GITHUB_WORKSPACE/bin/cr
        echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

    - name: "prepare modules"
      run: |
        set -euo pipefail
        module_dir="$HOME/.config/calcit/modules"
        mkdir -p "$module_dir"
        git clone https://github.com/calcit-lang/lilac.git "$module_dir/lilac"
        git -C "$module_dir/lilac" checkout --detach aff27ef3f450d83ecbb0b4537313b01f011af12e
        git clone https://github.com/calcit-lang/memof.git "$module_dir/memof"
        git -C "$module_dir/memof" checkout --detach 8689f9253ee306b349c0fb74d2bed9a9f7937c6f
        git clone https://github.com/Phlox-GL/phlox.git "$module_dir/phlox"
        git -C "$module_dir/phlox" checkout --detach c946287e035d46ce7270687c956601c23123f697
        git clone https://github.com/Respo/respo.calcit.git "$module_dir/respo.calcit"
        git -C "$module_dir/respo.calcit" checkout --detach 33945f86d9aadb1047a05882c846af4d70ecb0cf
        git clone https://github.com/Respo/respo-ui.calcit.git "$module_dir/respo-ui.calcit"
        git -C "$module_dir/respo-ui.calcit" checkout --detach fb5fff01c2264dfc209106d22423b7ed77be7ead

    - name: "compiles to js"
      run: |
        cr --emit-js --once
        cp assets/* js-out/
        yarn install --immutable
        yarn vite build --base=./

    - name: Deploy to server
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v1.1.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
